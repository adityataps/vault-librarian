"""Example configuration file for vault-librarian."""

# This file shows all available configuration options
# Copy this to config.yaml and customize as needed

llm:
  default_provider: copilot
  default_model: gpt-4o-mini
  
  routing:
    classify_note:
      provider: ollama
      model: llama3.2
      fallback: copilot
    
    summarize_meeting:
      provider: copilot
      model: gpt-4o
      fallback: anthropic
    
    extract_action_items:
      provider: anthropic
      model: claude-sonnet-4
      fallback: copilot
    
    generate_embedding:
      provider: copilot
      model: text-embedding-3-small
    
    conversational_query:
      provider: copilot
      model: gpt-4o
      fallback: anthropic
    
    audit_reclassify:
      provider: ollama
      model: llama3.2
      fallback: copilot

vault:
  # Folder descriptions for note classification
  folders:
    Projects: "Active work initiatives, chatbots, AI platforms, architecture docs"
    Jira: "Jira tickets and stories — files named AICOE-xxx or similar"
    Meetings: "Desk checks, sprint demos, standups, retrospectives, any dated meeting note"
    Tech Notes: "Cloud infrastructure, language/framework references, troubleshooting notes"
    Reference: "Glossary, evergreen reference material, definitions"
    Templates: "Reusable note templates"
    Career: "STAR stories, interview prep, retrospectives, offboarding checklists"

scheduler:
  daily_audit:
    hour: 2  # 2 AM
    minute: 0
  
  jira_sync:
    interval_minutes: 60  # Every hour
  
  weekly_digest:
    day: 6  # Sunday
    hour: 21  # 9 PM

jira:
  jql_filter: 'project = AICOE AND updated >= -7d'
  frontmatter_mappings:
    status: status
    priority: priority
    assignee: assignee
    parent: parent
    repos: customfield_10001  # Adjust to your custom field ID
