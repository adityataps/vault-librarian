name: vault-librarian
services:
  ollama:
    image: ollama/ollama:latest
    container_name: vault-librarian-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./docker-volumes/ollama:/root/.ollama
    environment:
      - OLLAMA_MODELS=${OLLAMA_MODELS:-llama3.2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - ollama
    # Uncomment the deploy section below if you have NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
